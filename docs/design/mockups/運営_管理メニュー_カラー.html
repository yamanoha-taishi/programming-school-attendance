<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラーモックアップ: 管理メニュー画面（運営・スマホ版）</title>
<style>
  :root{
    --primary:#2E5AAC;
    --primary-hover:#24457F;
    --primary-tint:#E8EEFA;
    --accent:#E8823C;
    --accent-hover:#C86A28;
    --accent-tint:#FCEADA;
    --border:#DCE0E5;
    --surface:#FFFFFF;
    --page-bg:#F4F5F7;
    --sunken:#EEF0F3;
    --text:#1F2430;
    --text-muted:#5B6472;
    --text-faint:#8A93A0;

    --status-attend:#2F9E4F;
    --status-attend-bg:#E8F7EC;
    --status-late:#B08000;
    --status-late-bg:#FBF3DC;
    --status-absent:#D6483F;
    --status-absent-bg:#FBEAE8;
    --status-transfer:#1E8A8A;
    --status-transfer-bg:#E4F5F5;
    --status-makeup:#7A4FC9;
    --status-makeup-bg:#F1EBFB;
    --status-pending:#767C87;
    --status-pending-bg:#EEEFF1;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background:var(--page-bg);
    margin:0;
    padding:32px;
    display:grid;
    grid-template-columns:260px 420px;
    column-gap:40px;
    align-items:start;
    color:var(--text);
  }
  .side{ grid-column:1; grid-row:1; }
  .main{ grid-column:2; grid-row:1; }
  .side h1{ font-size:18px; margin:0 0 4px; }
  .side .sub{ font-size:12px; color:var(--text-muted); margin-bottom:20px; }
  .side .note{
    font-size:12px;
    line-height:1.8;
    color:var(--text-muted);
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:12px 14px;
  }
  .side .note code{ font-size:11px; }

  /* --- phone frame --- */
  .phone{
    width:375px;
    border:3px solid var(--text);
    border-radius:28px;
    padding:10px;
    background:var(--surface);
  }
  .screen{
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    position:relative;
    height:780px;
    display:flex;
    flex-direction:column;
    background:var(--surface);
  }
  .content{
    flex:1;
  }

  .status-bar{
    height:20px;
    background:var(--sunken);
    border-bottom:1px solid var(--border);
  }
  .app-header{
    padding:10px 12px 8px;
    border-bottom:1px solid var(--border);
    font-size:12px;
    font-weight:normal;
    color:var(--text-muted);
  }

  .menu-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 14px;
    border-bottom:1px solid var(--border);
    font-size:14px;
    color:var(--text);
    font-weight:600;
    position:relative;
  }
  .menu-row .chevron{
    color:var(--primary);
    font-size:14px;
    font-weight:bold;
  }

  /* bottom tab bar */
  .tabbar{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--surface);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 0 8px;
    font-size:10px;
    color:var(--text-faint);
  }
  .tab svg{
    width:22px;
    height:22px;
    margin:0 auto 4px;
    display:block;
  }
  .tab.active{
    color:var(--primary);
    font-weight:bold;
  }

  .caption{
    font-size:11px;
    color:var(--text-muted);
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="side">
    <h1>管理メニュー画面</h1>
    <div class="sub">運営向け／スマホ／full_access のみ（attendance_onlyには非表示）</div>
    <div class="note">
      構造は元のWF（<code>wireframes/運営_管理メニュー.html</code>）と同じです。配色は<code>デザイントークン定義書.md</code>のトークンをそのまま適用しています。各項目の矢印をプライマリカラーにし、タップして遷移できることを示しています。
    </div>
  </div>

  <div class="main">
    <div class="phone">
      <div class="screen">
        <div class="status-bar"></div>

        <div class="content">
          <div class="app-header">管理メニュー</div>

          <div class="menu-row">
            保護者一覧
            <span class="chevron">›</span>
          </div>
          <div class="menu-row">
            生徒一覧
            <span class="chevron">›</span>
          </div>
          <div class="menu-row">
            スタッフ一覧
            <span class="chevron">›</span>
          </div>
        </div>

        <div class="tabbar">
          <div class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="4" width="14" height="17" rx="2"></rect>
              <rect x="9" y="2" width="6" height="4" rx="1"></rect>
              <line x1="8" y1="11" x2="16" y2="11"></line>
              <line x1="8" y1="15" x2="16" y2="15"></line>
            </svg>
            出席記録
          </div>
          <div class="tab active">
            <svg viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
              </g>
              <circle cx="9" cy="6" r="2.4" fill="currentColor"></circle>
              <circle cx="15" cy="12" r="2.4" fill="currentColor"></circle>
              <circle cx="7" cy="18" r="2.4" fill="currentColor"></circle>
            </svg>
            管理
          </div>
          <div class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c0-4 4-7 8-7s8 3 8 7"></path>
            </svg>
            プロフィール
          </div>
        </div>
      </div>
    </div>
    <div class="caption">
      ※attendance_only権限のスタッフはこの画面にアクセスできないため、下部タブに「管理」は表示されません。
    </div>
  </div>

</body>
</html>
