<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラーモックアップ: ログイン画面（運営・保護者共通／スマホ版）</title>
<style>
  :root{
    --primary:#2E5AAC;
    --primary-hover:#24457F;
    --primary-tint:#E8EEFA;
    --accent:#E8823C;
    --accent-tint:#FCEADA;
    --border:#DCE0E5;
    --surface:#FFFFFF;
    --page-bg:#F4F5F7;
    --sunken:#EEF0F3;
    --text:#1F2430;
    --text-muted:#5B6472;
    --text-faint:#8A93A0;
    --status-absent:#D6483F;
    --status-absent-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background:var(--page-bg);
    margin:0;
    padding:32px;
    display:grid;
    grid-template-columns:260px 420px;
    column-gap:40px;
    align-items:start;
    color:var(--text);
  }
  .side{ grid-column:1; grid-row:1; }
  .main{ grid-column:2; grid-row:1; }
  .side h1{ font-size:18px; margin:0 0 4px; }
  .side .sub{ font-size:12px; color:var(--text-muted); margin-bottom:20px; }
  .side .note{
    font-size:12px;
    line-height:1.8;
    color:var(--text-muted);
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:12px 14px;
  }
  .side .note a, .side .note code{
    font-size:11px;
  }

  /* --- phone frame --- */
  .phone{
    width:375px;
    border:3px solid var(--text);
    border-radius:28px;
    padding:10px;
    background:var(--surface);
  }
  .screen{
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    position:relative;
    height:780px;
    display:flex;
    flex-direction:column;
    background:var(--surface);
  }
  .content{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .status-bar{
    height:20px;
    background:var(--sunken);
    border-bottom:1px solid var(--border);
  }

  .brand{ text-align:center; margin-bottom:32px; }
  .brand-icon{
    width:56px;
    height:56px;
    background:var(--primary);
    border-radius:14px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .brand-icon svg{ width:30px; height:30px; }
  .brand-name{ font-size:15px; font-weight:bold; line-height:1.4; color:var(--text); }

  .error-banner{
    margin:0 12px 16px;
    background:var(--status-absent-bg);
    border:1px solid var(--status-absent);
    color:var(--status-absent);
    border-radius:8px;
    padding:10px 12px;
    font-size:11px;
    line-height:1.5;
  }

  .field{ margin:14px 12px 0; }
  .field label{ display:block; font-size:11px; color:var(--text-muted); margin-bottom:4px; }
  .field input{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:13px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }

  .action-box{ margin:22px 12px 0; }
  .login-btn{
    text-align:center;
    background:var(--primary);
    color:#fff;
    border-radius:8px;
    padding:12px 0;
    font-size:14px;
    font-weight:bold;
  }

  .forgot-row{ margin:16px 12px 0; text-align:center; }
  .forgot-link{ font-size:12px; color:var(--primary); text-decoration:underline; }

  .caption{
    font-size:11px;
    color:var(--text-muted);
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="side">
    <h1>ログイン画面</h1>
    <div class="sub">運営・保護者共通／スマホ／配色反映版</div>
    <div class="note">
      構造は元のWF（<code>wireframes/共通_ログイン.html</code>）と同じです。配色は<code>デザイントークン定義書.md</code>のトークンをそのまま適用しています。
    </div>
  </div>

  <div class="main">
    <div class="phone">
      <div class="screen">
        <div class="status-bar"></div>

        <div class="content">

          <div class="brand">
            <div class="brand-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
                <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
                <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
                <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
              </svg>
            </div>
            <div class="brand-name">プログラミング教室<br>出席管理</div>
          </div>

          <div class="error-banner">
            会員番号またはパスワードが正しくありません。
          </div>

          <div class="field">
            <label>会員番号</label>
            <input type="text" placeholder="例：0001">
          </div>

          <div class="field">
            <label>パスワード</label>
            <input type="text" placeholder="••••••••">
          </div>

          <div class="action-box">
            <div class="login-btn">ログイン</div>
          </div>

          <div class="forgot-row">
            <span class="forgot-link">パスワードをお忘れの方はこちら</span>
          </div>

        </div>

      </div>
    </div>
    <div class="caption">
      ※構造・仕様の詳細は元のWFの注記を参照してください。このファイルは配色の見え方確認用のモックアップです。
    </div>
  </div>

</body>
</html>
